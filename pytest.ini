[pytest]
# ==============================================================================
# 1. 基础路径与用例发现配置 (Discovery & Paths)
# ==============================================================================
# 框架版本卡口，确保中文参数化与严格标记特性生效
minversion = 7.0

# 自动将项目根目录加入 sys.path，保证跨包导入无障碍
pythonpath = .

# 测试用例目录与识别规则
testpaths = ./tests
norecursedirs = .* build dist CVS _darcs {arch} *.egg reports logs
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*


# ==============================================================================
# 2. 核心运行参数与报告输出 (CLI Options & Allure)
# ==============================================================================
addopts =
    # 基础执行：详细输出并实时打印控制台日志，启用独立导入模式
    -vs
    --import-mode=importlib

    # 报告与缓存：指定 Allure 结果路径并执行前清空，禁用本地 pytest 缓存
    --alluredir ./reports/allure-results
    --clean-alluredir
    -p no:cacheprovider

    # 标记规范：严格校验标记，未在 markers 注册直接阻断报错
    --strict-markers

    # 失败重跑：调试设 0 (不重跑)，CI 设 2 (共跑 3 次)，每次重跑间隔 1 秒
    --reruns 0
    --reruns-delay 1

    # 仅限基础设施异常重跑 (元素未找到/失效/超时/驱动自愈)，断言失败直接报错
    --only-rerun selenium.common.exceptions.NoSuchElementException
    --only-rerun selenium.common.exceptions.StaleElementReferenceException
    --only-rerun selenium.common.exceptions.TimeoutException
    --only-rerun UiAutomator2RecoveryError


# ==============================================================================
# 3. 自定义标记分层治理 (Markers Catalog)
# ==============================================================================
markers =
    # ------------------ 3.1 用例优先级体系标记 (Priority Levels) ------------------
    p0: P0 核心阻断用例 (Blocker：核心主路径、登录、基础消息收发、核心建群，MR/PR 门禁必跑)
    p1: P1 关键功能用例 (Critical：主要业务分支、群管理控制、富媒体收发、状态机流转)
    p2: P2 常规功能用例 (Normal：常规业务操作、偏好设置、深浅模式、历史记录)
    p3: P3 边缘异常用例 (Minor/Trivial：边界异常校验、提示文案、极端容错)

    # ------------------ 3.2 CI/CD 阶段与套件编排标记 (Suite & Stage Filters) ------------------
    smoke: 核心冒烟用例，用于 MR/PR 门禁快速构建 (<10min)
    regression: 全量回归测试集，用于每日凌晨定时流水线 (<60min)
    destructive: 破坏性用例（如注销、解散、移出群聊），建议单独运行或用 -m "not destructive" 排除
    flaky: 偶发性不稳定用例，自动加入隔离队列监控

    # ------------------ 3.3 环境生命周期与调度协议标记 (Lifecycle Protocol) ------------------
    enter_manager: 控制双端前置是否自动进入群管理页面 (True/False，默认True)
    skip_env_setup: 跳过双端全局进群前置，不进入主群（适用于自建群解散等动态场景）
    keep_env: 保持双端页面环境不每次 teardown 回主页，参数化用例或同组跨用例连续复用


# ==============================================================================
# 4. 告警过滤 (Warning Filters)
# ==============================================================================
# 过滤第三方库无害的警告信息，保持控制台与 Allure 报告纯净聚焦
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestWarning


# ==============================================================================
# 5. 参数化与中文编码支持 (Encoding & Test ID)
# ==============================================================================
# 禁止 pytest 对参数化用例 ID 进行 Unicode 转义，确保报告与控制台完美显示中文
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
