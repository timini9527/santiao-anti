[pytest]
pythonpath = .  # 这一行是关键，告诉 pytest 根目录是 . (当前目录)，自动把 项目根目录加入 sys.path

# 核心配置：
# --reruns 2 : 失败后重跑 2 次（加上原本的 1 次，共 3 次机会）
# --reruns-delay 1 : 每次重跑前等待 1 秒，让设备状态恢复
# --only-rerun : 【关键】只在遇到以下基础设施类异常时才重跑。
#   如果是 AssertionError (逻辑 Bug)，直接报失败，不浪费时间。
addopts =
    -vs --alluredir ./reports/allure-results
    --clean-alluredir
    --reruns 2
    --reruns-delay 1
    --only-rerun selenium.common.exceptions.NoSuchElementException
    --only-rerun selenium.common.exceptions.StaleElementReferenceException
    --only-rerun selenium.common.exceptions.TimeoutException
    --only-rerun selenium.common.exceptions.WebDriverException
    --only-rerun urllib3.exceptions.ReadTimeoutError
    --only-rerun urllib3.exceptions.MaxRetryError
    --only-rerun appium.webdriver.common.exceptions.WebDriverException
    --import-mode=importlib


testpaths = ./tests
python_files = test_*.py *_test.py

# 禁止 pytest 对参数化 ID 进行 Unicode 转义
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True