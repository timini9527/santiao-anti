name: 构建 macOS 原生桌面端与 DMG 安装包

# 触发条件：
# 1. 严格限定仅在 build-mac 专属构建分支推送时才触发 macOS 云端打包
# 2. 网页端支持手动按需触发 (workflow_dispatch)
on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '目标打包架构 (auto 则读取 build_mac_app.py 的 TARGET_MAC_ARCH 变量)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - x64
          - arm64
          - both
  push:
    branches:
      - build-mac

jobs:
  prepare:
    name: 解析打包目标架构变量
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 检出脚本读取 TARGET_MAC_ARCH
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop_app/build_mac_app.py

      - name: 生成动态构建矩阵
        id: set-matrix
        run: |
          python3 - <<'EOF'
          import json, os, re
          target = "${{ github.event.inputs.target_arch }}".strip().lower()
          if not target or target == "auto":
              with open("desktop_app/build_mac_app.py", "r", encoding="utf-8") as f:
                  content = f.read()
              m = re.search(r'^TARGET_MAC_ARCH\s*=\s*["\']([^"\']+)["\']', content, re.M)
              target = m.group(1).strip().lower() if m else "x64"

          items = []
          if target in ("x64", "both", "all"):
              items.append({
                  "os": "macos-15-intel",
                  "arch": "x64",
                  "label": "Intel_x86_64_虚拟机与Intel专用",
                  "artifact_name": "Santiao_IM_macOS_Intel_x64_DMG_Setup",
              })
          if target in ("arm64", "both", "all"):
              items.append({
                  "os": "macos-latest",
                  "arch": "arm64",
                  "label": "AppleSilicon_M系列芯片专用",
                  "artifact_name": "Santiao_IM_macOS_AppleSilicon_arm64_DMG_Setup",
              })
          if not items:
              items.append({
                  "os": "macos-15-intel",
                  "arch": "x64",
                  "label": "Intel_x86_64_虚拟机与Intel专用",
                  "artifact_name": "Santiao_IM_macOS_Intel_x64_DMG_Setup",
              })

          matrix_json = json.dumps({"include": items}, ensure_ascii=False)
          print(f"Target={target}, Matrix={matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={matrix_json}\n")
          EOF

  build-macos:
    name: 打包 macOS DMG (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出工程代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 3.13 运行环境 (${{ matrix.arch }})
        id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: 极速恢复虚拟环境缓存 (${{ matrix.arch }})
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: mac-venv-v3-${{ matrix.arch }}-${{ steps.setup-py.outputs.python-version }}-${{ hashFiles('.github/workflows/build_mac_dmg.yml') }}

      - name: 安装桌面端与打包核心依赖 (${{ matrix.arch }})
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip uv
          .venv/bin/uv pip install --python .venv/bin/python --only-binary=cryptography "cryptography==43.0.3"
          .venv/bin/uv pip install --python .venv/bin/python PyQt6 PyInstaller Pillow pytest pytest-check pytest-rerunfailures allure-pytest Appium-Python-Client selenium hmnextauto lxml requests PyYAML colorlog ImageHash pandas pypinyin python-dateutil psutil "opencv-python-headless<5.0" numpy setuptools tidevice uiautomator2 grpcio
          .venv/bin/uv pip install --python .venv/bin/python --only-binary=cryptography "cryptography==43.0.3" pymobiledevice3 av || echo "提示: 扩展投屏依赖跳过，使用内嵌 tidevice 引擎"

      - name: 执行自动化打包生成原生 .app 与 .dmg 安装镜像 (${{ matrix.arch }})
        run: |
          .venv/bin/python desktop_app/build_mac_app.py

      - name: 上传最终生成的 macOS DMG 安装包至 GitHub 页面 (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/SetupInstaller/*.dmg
          retention-days: 30
          if-no-files-found: error
