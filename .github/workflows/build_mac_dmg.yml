name: 构建 macOS 原生桌面端与 DMG 安装包

# 触发条件：
# 1. 严格限定仅在 build-mac 专属构建分支推送时才触发 macOS 云端打包
# 2. 网页端支持手动按需触发 (workflow_dispatch)
on:
  workflow_dispatch:
  push:
    branches:
      - build-mac
    paths:
      - 'desktop_app/**'
      - 'web_platform/backend/devices.py'
      - '.github/workflows/build_mac_dmg.yml'

jobs:
  build-macos:
    name: 打包 macOS DMG (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            label: Intel_x86_64_虚拟机与Intel专用
            artifact_name: Santiao_IM_macOS_Intel_x64_DMG_Setup
          - os: macos-latest
            arch: arm64
            label: AppleSilicon_M系列芯片专用
            artifact_name: Santiao_IM_macOS_AppleSilicon_arm64_DMG_Setup

    steps:
      - name: 检出工程代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 3.13 运行环境 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: 'pip'

      - name: 安装桌面端与打包核心依赖 (${{ matrix.arch }})
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir PyQt6 PyInstaller Pillow pytest pytest-check pytest-rerunfailures allure-pytest Appium-Python-Client selenium hmnextauto lxml requests websockets PyYAML colorlog ImageHash pandas pypinyin python-dateutil psutil "opencv-python-headless<5.0" numpy setuptools tidevice uiautomator2 grpcio
          pip install --no-cache-dir pymobiledevice3 av || echo "提示: 扩展投屏依赖跳过，使用内嵌 tidevice 引擎"

      - name: 执行自动化打包生成原生 .app 与 .dmg 安装镜像 (${{ matrix.arch }})
        run: |
          python desktop_app/build_mac_app.py

      - name: 上传最终生成的 macOS DMG 安装包至 GitHub 页面 (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/SetupInstaller/*.dmg
          retention-days: 30
          if-no-files-found: error
