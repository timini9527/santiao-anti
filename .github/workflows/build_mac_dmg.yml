name: 构建 macOS 原生桌面端与 DMG 安装包

# 触发条件：
# 1. 严格限定仅在 build-mac 专属构建分支推送时才触发 macOS 云端打包
# 2. 网页端支持手动按需触发 (workflow_dispatch)
on:
  workflow_dispatch:
  push:
    branches:
      - build-mac
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build_mac_dmg.yml'

jobs:
  build-macos:
    name: 在云端真实 macOS 虚拟机中打包 DMG
    runs-on: macos-latest

    steps:
      - name: 检出工程代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 3.13 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装桌面端与打包核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyInstaller Pillow pytest allure-pytest requests PyYAML colorlog ImageHash

      - name: 执行自动化打包生成原生 .app 与 .dmg 安装镜像
        run: |
          python desktop_app/build_mac_app.py

      - name: 上传最终生成的 macOS DMG 安装包至 GitHub 页面
        uses: actions/upload-artifact@v4
        with:
          name: Santiao_IM_macOS_DMG_Setup
          path: dist/SetupInstaller/*.dmg
          retention-days: 30
          if-no-files-found: error
