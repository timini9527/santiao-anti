<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM 自动化测试局域网控制台</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: rgba(25, 33, 46, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 侧边栏顶部导航 */
        header {
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(15, 20, 28, 0.3);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-dot.running {
            background-color: var(--primary-color);
            box-shadow: 0 0 8px var(--primary-color);
            animation: pulse 1.5s infinite;
        }

        .status-dot.finished-success {
            background-color: var(--success-color);
        }

        .status-dot.finished-failed {
            background-color: var(--danger-color);
        }

        /* 主体布局 */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* 左侧用例树状列表 */
        .sidebar {
            width: 440px;
            border-right: 1px solid var(--border-color);
            background: rgba(20, 27, 38, 0.4);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .tree-node {
            margin-bottom: 12px;
        }

        .file-title {
            font-size: 14px;
            font-weight: 600;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            cursor: pointer;
        }

        .file-title:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .file-title span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .class-node {
            margin-left: 15px;
            margin-top: 6px;
            border-left: 1px dashed rgba(255, 255, 255, 0.1);
            padding-left: 10px;
        }

        .class-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 4px 6px;
        }

        .test-list {
            margin-left: 10px;
        }

        .test-item {
            font-size: 13px;
            color: #d1d5db;
            padding: 6px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s;
        }

        .test-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .test-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: all;
        }

        .run-btn {
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .run-btn:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .run-btn:disabled {
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            background: transparent;
        }

        /* 右侧终端输出 */
        .console-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0f17;
            padding: 20px;
            overflow: hidden;
        }

        .console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .console-title {
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stop-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }

        .stop-btn.visible {
            display: block;
        }

        .stop-btn:hover {
            background: var(--danger-color);
            color: #fff;
            border-color: var(--danger-color);
        }

        .terminal {
            flex: 1;
            background: #070913;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            font-family: "Fira Code", "Courier New", Courier, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #34d399;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        body.is-resizing * {
            user-select: none !important;
            pointer-events: none !important;
            transition: none !important;
        }
        body.is-resizing .sidebar, body.is-resizing header {
            backdrop-filter: none !important;
        }
        body.is-resizing #h-resizer,
        body.is-resizing #resizer,
        body.is-resizing #v-resizer-sidebar {
            pointer-events: auto !important;
        }
        body.is-resizing #report-area,
        body.is-resizing #terminal-area {
            box-shadow: none !important;
        }
        .sidebar,
        #report-area,
        #params-container {
            will-change: width, height;
        }
        body.is-resizing-h, body.is-resizing-h * {
            cursor: ew-resize !important;
        }
        body.is-resizing-v, body.is-resizing-v * {
            cursor: ns-resize !important;
        }

        /* 移动端适配响应式布局 */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            header > div:last-child {
                justify-content: space-between;
            }
            main {
                flex-direction: column;
            }
            .sidebar {
                width: 100% !important;
                height: 50% !important;
                border-right: none;
                border-bottom: 2px solid var(--border-color);
                flex: none;
            }
            #h-resizer {
                display: none !important;
            }
            #v-resizer-sidebar {
                display: none !important;
            }
            .console-area {
                padding-left: 15px !important;
                height: 50% !important;
                flex: 1;
            }
            #params-container {
                height: auto !important;
                max-height: 180px;
            }
            /* 输入框和按钮组允许换行 */
            #params-container > div[style*="display: flex"] {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="sidebar" id="sidebar">
            <header>
                <div class="logo-area">
                    <div class="logo-icon">IM</div>
                    <div>
                        <h1 class="logo-title">三条 自动化测试控制台</h1>
                        <p style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">局域网共享执行模式 (免配置)</p>
                    </div>
                </div>
            </header>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="输入关键字搜索用例..." oninput="filterTests()">
                <div id="total-count-display" style="font-size: 12px; color: var(--primary-color); margin-top: 8px; text-align: right; font-weight: bold;"></div>
            </div>
            <div class="tree-container" id="tree-container" style="flex: 1; overflow-y: auto;">
                <!-- 测试树状列表动态渲染 -->
                <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">正在载入测试用例...</div>
            </div>
            
            <!-- 侧边栏垂直拖拽分割线 -->
            <div id="v-resizer-sidebar" style="height: 14px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent; transition: background 0.2s; border-top: 1px solid rgba(255,255,255,0.05);" onmouseover="this.style.background='rgba(0,0,0,0.2)'" onmouseout="this.style.background='transparent'">
                <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px;"></div>
            </div>
            
            <div id="params-container" style="padding: 15px; padding-top: 5px; font-size: 12px; flex-shrink: 0; height: 210px; overflow-y: auto;">
                <div style="color: var(--primary-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <span>🔌 远程设备调试 (非必填)</span>
                    <span title="清空" style="cursor: pointer; color: var(--text-muted);" onclick="document.getElementById('remote-appium').value=''; document.getElementById('remote-udid').value=''; document.getElementById('private-chat-name').value=''; document.getElementById('group-chat-name').value=''; document.getElementById('debug-mode').checked=false;">清空</span>
                </div>
                <div style="display: flex; gap: 5px; margin-bottom: 6px;">
                    <select id="os-select" style="padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; outline: none; cursor: pointer;">
                        <option value="windows">Win</option>
                        <option value="mac">Mac</option>
                    </select>
                    <input type="text" id="remote-appium" placeholder="Appium (如 127.0.0.1:4723)" style="flex: 1; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; box-sizing: border-box; outline: none;">
                    <select id="appium-quick-select" onchange="if(this.value){document.getElementById('remote-appium').value = this.value; this.value = '';}" style="padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; outline: none; cursor: pointer; max-width: 90px;">
                        <option value="">快速选择</option>
                        <option value="192.168.1.212:4723">192.168.1.212:4723</option>
                        <option value="192.168.1.135:4723">192.168.1.135:4723</option>
                    </select>
                    <button onclick="startAppium(event)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; cursor: pointer; padding: 0 10px; font-size: 12px; transition: all 0.2s; white-space: nowrap;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'" title="在服务端执行 appium -a 0.0.0.0">🚀 启动</button>
                    <button onclick="detectAppium(event)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; cursor: pointer; padding: 0 10px; font-size: 12px; transition: all 0.2s; white-space: nowrap;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">自动获取</button>
                </div>
                <div id="appium-error" style="color: #ef4444; font-size: 10px; margin-top: -4px; margin-bottom: 6px; display: none;">未检测到本机 Appium 服务</div>
                
                <div style="display: flex; gap: 5px; margin-bottom: 6px;">
                    <input type="text" id="remote-udid" placeholder="手机 UDID (如 emulator-5554)" style="flex: 1; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; box-sizing: border-box; outline: none;">
                    <select id="udid-quick-select" onchange="if(this.value){document.getElementById('remote-udid').value = this.value; this.value = '';}" style="padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; outline: none; cursor: pointer; max-width: 90px;">
                        <option value="">快速选择</option>
                        <option value="QFF0219A11009305">QFF0219A11009305</option>
                        <option value="20a5fa17">20a5fa17</option>
                    </select>
                    <button onclick="detectUdid(event)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; cursor: pointer; padding: 0 10px; font-size: 12px; transition: all 0.2s; white-space: nowrap;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">自动获取</button>
                </div>
                <div id="udid-error" style="color: #ef4444; font-size: 10px; margin-top: -4px; margin-bottom: 6px; display: none;">未检测到已连接 of Android 设备</div>
                
                <input type="text" id="private-chat-name" placeholder="测试私聊名称 (非必填)" style="width: 100%; margin-bottom: 6px; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; box-sizing: border-box; outline: none;">
                <input type="text" id="group-chat-name" placeholder="测试群聊名称 (非必填)" style="width: 100%; margin-bottom: 6px; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; box-sizing: border-box; outline: none;">
                <label style="display: flex; align-items: center; color: var(--text-muted); cursor: pointer; margin-top: 8px;">
                    <input type="checkbox" id="debug-mode" style="margin-right: 6px;"> <span style="line-height: 1.4;">🐞 开启调试模式<br><span style="font-size: 10px; color: #666;">(输出底层日志且测试后不退出 App)</span></span>
                </label>
            </div>
        </div>

        <!-- 侧边栏水平拖拽分割线 -->
        <div id="h-resizer" style="width: 14px; cursor: ew-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.2)'" onmouseout="this.style.background='transparent'">
            <div style="width: 4px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 4px;"></div>
        </div>

        <div class="console-area" style="display: flex; flex-direction: column; padding: 15px; padding-left: 0; gap: 0; flex: 1;">
            <!-- 上半部分：测试报告 -->
            <div id="report-area" style="height: 75%; display: flex; flex-direction: column; background: #070913; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-shrink: 0;">
                <div class="console-header" style="margin: 0; padding: 10px 15px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <div class="console-title" style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;">
                        <span>📊 测试用例报告 (Allure 智能面板)</span>
                        <span style="color: var(--text-muted); font-size: 12px; font-weight: normal; margin-right: 15px; flex-shrink: 0;">直观报告</span>
                        
                        <!-- 移动过来的 Web回执 和 执行状态 -->
                        <button onclick="document.getElementById('receipt-modal').style.display='flex'" style="background: rgba(59, 130, 246, 0.2); border: 1px solid var(--primary-color); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;" onmouseover="this.style.background='rgba(59, 130, 246, 0.4)'" onmouseout="this.style.background='rgba(59, 130, 246, 0.2)'">📝 填写 Web 回执</button>
                        <div class="status-badge" style="padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; border: 1px solid var(--border-color); white-space: nowrap; flex-shrink: 0;">
                            <span id="global-status-dot" class="status-dot"></span>
                            <span id="global-status-text">就绪</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center; flex-shrink: 0;">
                        <select id="role-select" onchange="changeReportRole()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer;">
                            <option value="business">业务展示视角 (极简)</option>
                            <option value="tech">测试开发视角 (完整)</option>
                        </select>
                        <button class="run-btn" onclick="document.getElementById('report-iframe').src='/allure/' + taskId + '/'; document.getElementById('report-iframe').style.display='block'; document.getElementById('report-placeholder').style.display='none';">刷新报告</button>
                    </div>
                </div>
                <div style="flex: 1; position: relative; display: flex; flex-direction: column; background: #fff;">
                    <iframe id="report-iframe" onload="changeReportRole()" style="flex: 1; width: 100%; height: 100%; border: none; display: none;" src="/allure/"></iframe>
                    <div id="report-placeholder" style="color: var(--text-muted); text-align: center; position: absolute; top: 0; left: 0; background: #070913; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                        <div style="font-size: 24px; margin-bottom: 10px;">✨</div>
                        <!-- <div>Allure 引擎将在测试后自动介入</div> -->
                        <div style="font-size: 12px; margin-top: 5px;">请先运行任意测试用例，报告生成后点击右上角“刷新”即可</div>
                    </div>
                </div>
            </div>

            <!-- 可拖拽的隐形分割线 (增加上下外边距方便拖拽) -->
            <div id="resizer" style="height: 14px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px;"></div>
            </div>

            <!-- 下半部分：终端日志 -->
            <div id="terminal-area" style="flex: 1; display: flex; flex-direction: column; background: #070913; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <div class="console-header" style="margin: 0; padding: 10px 15px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-color);">
                    <div class="console-title">
                        <span>📟 终端实时输出</span>
                        <span id="current-running-node" style="color: var(--text-muted); font-size: 12px; font-weight: normal; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 10px;"></span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="run-btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--text-muted);" onclick="document.getElementById('terminal-screen').innerHTML='等待选择用例并运行...'">🗑️ 清空日志</button>
                        <button id="btn-stop" class="stop-btn" onclick="stopTest()">终止运行</button>
                    </div>
                </div>
                <div class="terminal" id="terminal-screen" style="flex: 1; margin: 0; box-shadow: none; border-radius: 0;">等待选择用例并运行...</div>
            </div>
        </div>
    </main>

    <script>
        // 生成唯一的 Task ID，保证多端并发执行时的数据通道隔离
        const taskId = 'task_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        let testList = [];
        let sseConnection = null;

        // 从 localStorage 读取已展开的树节点集合，确保刷新页面不重置
        let expandedNodes = new Set(JSON.parse(localStorage.getItem('expandedNodes') || '[]'));

        function saveExpandedNodes() {
            localStorage.setItem('expandedNodes', JSON.stringify(Array.from(expandedNodes)));
        }

        function setupResizerLegacy() {
            const resizer = document.getElementById('resizer');
            const reportArea = document.getElementById('report-area');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isResizing = true;
                document.body.classList.add('is-resizing', 'is-resizing-v');
                document.getElementById('report-iframe').style.pointerEvents = 'none'; // 避免 iframe 吞咽鼠标事件
            });

            const hResizer = document.getElementById('h-resizer');
            const sidebar = document.getElementById('sidebar');
            let isHResizing = false;

            hResizer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isHResizing = true;
                document.body.classList.add('is-resizing', 'is-resizing-h');
                document.getElementById('report-iframe').style.pointerEvents = 'none';
            });

            const vResizerSidebar = document.getElementById('v-resizer-sidebar');
            const paramsContainer = document.getElementById('params-container');
            let isVResizingSidebar = false;

            vResizerSidebar.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isVResizingSidebar = true;
                document.body.classList.add('is-resizing', 'is-resizing-v');
                document.getElementById('report-iframe').style.pointerEvents = 'none';
            });

            let rAF;
            document.addEventListener('mousemove', (e) => {
                if (!isResizing && !isHResizing && !isVResizingSidebar) return;
                
                if (rAF) cancelAnimationFrame(rAF);
                rAF = requestAnimationFrame(() => {
                    if (isResizing) {
                        const container = document.querySelector('.console-area');
                        const containerRect = container.getBoundingClientRect();
                        
                        // 计算鼠标在容器内的高度
                        let newHeight = e.clientY - containerRect.top - 15; // 减去 padding
                        if (newHeight < 100) newHeight = 100; // 最小高度 100px
                        if (newHeight > containerRect.height - 100) newHeight = containerRect.height - 100;
                        
                        reportArea.style.height = newHeight + 'px';
                    }
                    
                    if (isHResizing) {
                        let newWidth = e.clientX;
                        if (newWidth < 200) newWidth = 200; // 最小宽度 200px
                        if (newWidth > window.innerWidth - 300) newWidth = window.innerWidth - 300; // 最大宽度
                        
                        sidebar.style.width = newWidth + 'px';
                    }
                    
                    if (isVResizingSidebar) {
                        const sidebarRect = sidebar.getBoundingClientRect();
                        let newHeight = sidebarRect.bottom - e.clientY - 15;
                        if (newHeight < 40) newHeight = 40;
                        if (newHeight > sidebarRect.height - 100) newHeight = sidebarRect.height - 100;
                        paramsContainer.style.height = newHeight + 'px';
                    }
                });
            });

            document.addEventListener('mouseup', () => {
                if (isResizing || isHResizing || isVResizingSidebar) {
                    isResizing = false;
                    isHResizing = false;
                    isVResizingSidebar = false;
                    document.body.classList.remove('is-resizing', 'is-resizing-h', 'is-resizing-v');
                    document.getElementById('report-iframe').style.pointerEvents = 'auto';
                }
            });
        }

        function setupResizer() {
            const resizer = document.getElementById('resizer');
            const reportArea = document.getElementById('report-area');
            const hResizer = document.getElementById('h-resizer');
            const sidebar = document.getElementById('sidebar');
            const vResizerSidebar = document.getElementById('v-resizer-sidebar');
            const paramsContainer = document.getElementById('params-container');
            const reportIframe = document.getElementById('report-iframe');
            let resizeState = null;
            let pendingPoint = null;
            let rAF = null;

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function beginResize(mode, e) {
                e.preventDefault();
                const consoleRect = document.querySelector('.console-area').getBoundingClientRect();
                const sidebarRect = sidebar.getBoundingClientRect();
                resizeState = {
                    mode,
                    consoleTop: consoleRect.top,
                    consoleHeight: consoleRect.height,
                    sidebarBottom: sidebarRect.bottom,
                    sidebarHeight: sidebarRect.height,
                    maxSidebarWidth: window.innerWidth - 300
                };
                pendingPoint = { x: e.clientX, y: e.clientY };
                document.body.classList.add('is-resizing', mode === 'h' ? 'is-resizing-h' : 'is-resizing-v');
                reportIframe.style.pointerEvents = 'none';
                if (e.currentTarget.setPointerCapture) {
                    e.currentTarget.setPointerCapture(e.pointerId);
                }
            }

            function applyResize() {
                rAF = null;
                if (!resizeState || !pendingPoint) return;

                if (resizeState.mode === 'main-v') {
                    const newHeight = clamp(pendingPoint.y - resizeState.consoleTop - 15, 100, resizeState.consoleHeight - 100);
                    reportArea.style.height = newHeight + 'px';
                } else if (resizeState.mode === 'h') {
                    const newWidth = clamp(pendingPoint.x, 200, resizeState.maxSidebarWidth);
                    sidebar.style.width = newWidth + 'px';
                } else if (resizeState.mode === 'sidebar-v') {
                    const newHeight = clamp(resizeState.sidebarBottom - pendingPoint.y - 15, 40, resizeState.sidebarHeight - 100);
                    paramsContainer.style.height = newHeight + 'px';
                }
            }

            // pointermove和pointerup的统一处理
            function updateResize(e) {
                if (!resizeState) return;
                pendingPoint = { x: e.clientX, y: e.clientY };
                if (!rAF) rAF = requestAnimationFrame(applyResize);
            }

            function endResize(e) {
                if (!resizeState) return;
                if (e && e.currentTarget && e.currentTarget.releasePointerCapture) {
                    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
                }
                resizeState = null;
                pendingPoint = null;
                if (rAF) {
                    cancelAnimationFrame(rAF);
                    rAF = null;
                }
                document.body.classList.remove('is-resizing', 'is-resizing-h', 'is-resizing-v');
                reportIframe.style.pointerEvents = 'auto';
            }

            [
                [resizer, 'main-v'],
                [hResizer, 'h'],
                [vResizerSidebar, 'sidebar-v']
            ].forEach(([handle, mode]) => {
                handle.addEventListener('pointerdown', (e) => beginResize(mode, e));
                handle.addEventListener('pointermove', updateResize);
                handle.addEventListener('pointerup', endResize);
                handle.addEventListener('pointercancel', endResize);
                handle.addEventListener('lostpointercapture', endResize);
            });
        }

        function renderTree(filter = "") {
            const container = document.getElementById('tree-container');
            container.innerHTML = "";

            let matchCount = 0;
            let totalTestCount = 0;

            let processedFiles = [];
            testList.forEach(fileObj => {
                const fileBaseName = fileObj.file.split('/').pop();
                const fileDisplayName = fileObj.display_name || fileBaseName;
                
                let fileMatches = fileDisplayName.toLowerCase().includes(filter.toLowerCase()) || fileObj.file.toLowerCase().includes(filter.toLowerCase());
                let filteredClasses = [];
                let fileCount = 0;
                
                fileObj.classes.forEach(cls => {
                    let classMatches = cls.name.toLowerCase().includes(filter.toLowerCase()) || (cls.display_name && cls.display_name.toLowerCase().includes(filter.toLowerCase()));
                    let filteredTests = [];
                    let classCount = 0;
                    
                    cls.tests.forEach(t => {
                        let tName = t.display_name || t.name;
                        if (tName.toLowerCase().includes(filter.toLowerCase())) {
                            filteredTests.push(t);
                            classCount += (!t.params || t.params.length === 0) ? 1 : t.params.length;
                        }
                    });
                    
                    if (classMatches || filteredTests.length > 0) {
                        filteredClasses.push({
                            name: cls.name,
                            display_name: cls.display_name,
                            tests: classMatches && filteredTests.length === 0 ? cls.tests : filteredTests,
                            count: classCount
                        });
                        fileCount += classCount;
                    }
                });

                let filteredFuncs = [];
                fileObj.tests.forEach(t => {
                    let tName = t.display_name || t.name;
                    if (tName.toLowerCase().includes(filter.toLowerCase())) {
                        filteredFuncs.push(t);
                        fileCount += (!t.params || t.params.length === 0) ? 1 : t.params.length;
                    }
                });

                if (fileMatches || filteredClasses.length > 0 || filteredFuncs.length > 0) {
                    matchCount++;
                    totalTestCount += fileCount;
                    processedFiles.push({
                        ...fileObj,
                        fileBaseName,
                        fileDisplayName,
                        filteredClasses,
                        filteredFuncs,
                        fileCount
                    });
                }
            });

            // 按子目录分类
            let categories = {}; // key: categoryName, value: array of files
            let directFiles = []; // files directly under tests/

            processedFiles.forEach(pf => {
                let relPath = pf.file;
                if (relPath.startsWith("tests/")) {
                    relPath = relPath.substring("tests/".length);
                }
                const parts = relPath.split('/');
                if (parts.length > 1) {
                    const catName = parts[0];
                    if (!categories[catName]) {
                        categories[catName] = [];
                    }
                    categories[catName].push(pf);
                } else {
                    directFiles.push(pf);
                }
            });

                const catContent = document.createElement('div');
                catContent.className = 'file-content-div';
                catContent.style.display = isExpanded ? 'block' : 'none';
                
                categories[catName].forEach(pf => {
                    const fileSubNode = document.createElement('div');
                    fileSubNode.style.marginLeft = '15px';
                    fileSubNode.style.marginTop = '5px';
                    
                    const fileTitle = document.createElement('div');
                    fileTitle.className = 'file-title';
                    fileTitle.style.cursor = 'pointer';
                    fileTitle.style.background = 'rgba(255,255,255,0.02)';
                    
                    const fileTitleText = document.createElement('span');
                    fileTitleText.textContent = `👾 ${pf.fileDisplayName} [${pf.fileCount}]`;
                    fileTitleText.title = pf.file;
                    fileTitle.appendChild(fileTitleText);
                    
                    const runFileBtn = document.createElement('button');
                    runFileBtn.className = 'run-btn';
                    runFileBtn.textContent = '运行文件';
                    runFileBtn.onclick = (e) => {
                        e.stopPropagation();
                        runNode(pf.file);
                    };
                    fileTitle.appendChild(runFileBtn);
                    fileSubNode.appendChild(fileTitle);
                    
                    const subFileKey = `file::${pf.file}`;
                    const isSubFileExpanded = expandedNodes.has(subFileKey);
                    
                    const fileContent = document.createElement('div');
                    fileContent.style.display = isSubFileExpanded ? 'block' : 'none';
                    fileContent.style.marginLeft = '15px';
                    
                    fileTitle.onclick = () => {
                        const isHidden = fileContent.style.display === 'none';
                        fileContent.style.display = isHidden ? 'block' : 'none';
                        if (isHidden) {
                            expandedNodes.add(subFileKey);
                        } else {
                            expandedNodes.delete(subFileKey);
                        }
                        saveExpandedNodes();
                    };
                    
                    renderClassesAndFuncs(pf, fileContent);
                    fileSubNode.appendChild(fileContent);
                    catContent.appendChild(fileSubNode);
                });
                
                catTitle.onclick = () => {
                    const isHidden = catContent.style.display === 'none';
                    if (isHidden) {
                        // 折叠所有其他一级目录，并清除它们的展开状态
                        container.querySelectorAll('.file-content-div').forEach(div => {
                            div.style.display = 'none';
                        });
                        for (let k of expandedNodes) {
                            if (k.startsWith('category::') || k.startsWith('file::')) {
                                expandedNodes.delete(k);
                            }
                        }
                        container.querySelectorAll('.file-title > span').forEach(span => {
                            if (span.textContent.startsWith('📖')) {
                                span.textContent = span.textContent.replace('📖', '📇');
                            }
                        });
                        
                        // 展开当前分类目录
                        catContent.style.display = 'block';
                        catTitleText.textContent = `📖 ${catName} [${catCount}]`;
                        expandedNodes.add(nodeKey);
                    } else {
                        // 折叠当前分类目录
                        catContent.style.display = 'none';
                        catTitleText.textContent = `📇 ${catName} [${catCount}]`;
                        expandedNodes.delete(nodeKey);
                    }
                    saveExpandedNodes();
                };

                catNode.appendChild(catContent);
                container.appendChild(catNode);
            });

            // 渲染根目录下的独立测试文件
            directFiles.forEach(pf => {
                const fileNode = document.createElement('div');
                fileNode.className = 'tree-node';
                
                const fileTitle = document.createElement('div');
                fileTitle.className = 'file-title';
                fileTitle.style.cursor = 'pointer';
                
                const nodeKey = `file::${pf.file}`;
                const isExpanded = expandedNodes.has(nodeKey);
                
                const fileTitleText = document.createElement('span');
                fileTitleText.textContent = isExpanded ? `📖 ${pf.fileDisplayName} [${pf.fileCount}]` : `📇 ${pf.fileDisplayName} [${pf.fileCount}]`;
                fileTitleText.title = pf.file;
                fileTitle.appendChild(fileTitleText);
                
                const runFileBtn = document.createElement('button');
                runFileBtn.className = 'run-btn';
                runFileBtn.textContent = '运行文件';
                runFileBtn.onclick = (e) => {
                    e.stopPropagation();
                    runNode(pf.file);
                };
                fileTitle.appendChild(runFileBtn);
                fileNode.appendChild(fileTitle);
                
                const fileContent = document.createElement('div');
                fileContent.className = 'file-content-div';
                fileContent.style.display = isExpanded ? 'block' : 'none';
                
                fileTitle.onclick = () => {
                    const isHidden = fileContent.style.display === 'none';
                    if (isHidden) {
                        // 折叠所有其他一级目录，并清除它们的展开状态
                        container.querySelectorAll('.file-content-div').forEach(div => {
                            div.style.display = 'none';
                        });
                        for (let k of expandedNodes) {
                            if (k.startsWith('category::') || k.startsWith('file::')) {
                                expandedNodes.delete(k);
                            }
                        }
                        container.querySelectorAll('.file-title > span').forEach(span => {
                            if (span.textContent.startsWith('📖')) {
                                span.textContent = span.textContent.replace('📖', '📇');
                            }
                        });
                        
                        fileContent.style.display = 'block';
                        fileTitleText.textContent = `📖 ${pf.fileDisplayName} [${pf.fileCount}]`;
                        expandedNodes.add(nodeKey);
                    } else {
                        fileContent.style.display = 'none';
                        fileTitleText.textContent = `📇 ${pf.fileDisplayName} [${pf.fileCount}]`;
                        expandedNodes.delete(nodeKey);
                    }
                    saveExpandedNodes();
                };
                
                renderClassesAndFuncs(pf, fileContent);
                fileNode.appendChild(fileContent);
                container.appendChild(fileNode);
            });

            if (matchCount === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 50px;">无匹配的测试用例</div>';
                document.getElementById('total-count-display').textContent = `总计: 0 个用例`;
            } else {
                document.getElementById('total-count-display').textContent = `总计: ${totalTestCount} 个用例`;
            }
        }

        function filterTests() {
            const query = document.getElementById('search-input').value;
            renderTree(query);
        }

        function runNode(nodeid, paramIndex = null) {
            const remoteAppium = document.getElementById('remote-appium') ? document.getElementById('remote-appium').value.trim() : '';
            const remoteUdid = document.getElementById('remote-udid') ? document.getElementById('remote-udid').value.trim() : '';
            const debugMode = document.getElementById('debug-mode') && document.getElementById('debug-mode').checked;
            const privateChatName = document.getElementById('private-chat-name') ? document.getElementById('private-chat-name').value.trim() : '';
            const groupChatName = document.getElementById('group-chat-name') ? document.getElementById('group-chat-name').value.trim() : '';
            const webReceiptData = document.getElementById('dynamic-form-container') ? getDynamicFormData() : '';

            document.getElementById('terminal-screen').innerHTML = `🔄 正在准备启动用例: ${nodeid}\n`;
            
            fetch('/api/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    task_id: taskId,
                    nodeid: nodeid,
                    param_index: paramIndex,
                    remote_appium: remoteAppium,
                    remote_udid: remoteUdid,
                    debug_mode: debugMode,
                    private_chat_name: privateChatName,
                    group_chat_name: groupChatName,
                    web_receipt_data: webReceiptData
                })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.success) {
                    alert('启动失败: ' + data.message);
                }
            })
            .catch(err => {
                alert('启动失败，连接错误');
            });
        }

        function stopTest() {
            if (confirm('确定要强行终止当前正在执行的测试用例吗？')) {
                fetch('/api/stop', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_id: taskId })
                })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                    });
            }
        }

        function setupSSE() {
            if (sseConnection) sseConnection.close();
            
            sseConnection = new EventSource('/api/logs/stream?task_id=' + taskId);
            const screen = document.getElementById('terminal-screen');
            
            sseConnection.onmessage = function(event) {
                const log = JSON.parse(event.data);
                
                // 将 ansi 转义序列转为简单的 css color 样式显示
                let formattedLog = escapeHtml(log)
                    .replace(/\x1b\[[0-9;]*31m/g, '<span style="color:#f87171;">')
                    .replace(/\x1b\[[0-9;]*32m/g, '<span style="color:#34d399;">')
                    .replace(/\x1b\[[0-9;]*33m/g, '<span style="color:#fbbf24;">')
                    .replace(/\x1b\[[0-9;]*34m/g, '<span style="color:#60a5fa;">')
                    .replace(/\x1b\[[0-9;]*35m/g, '<span style="color:#c084fc;">')
                    .replace(/\x1b\[[0-9;]*36m/g, '<span style="color:#2dd4bf;">')
                    .replace(/\x1b\[[0-9;]*90m/g, '<span style="color:#9ca3af;">') // gray
                    .replace(/\x1b\[[0-9;]*m/g, '</span>')
                    // 兜底清除所有其他未被匹配到的 ANSI 转义码和残留 ESC 字符，防止页面出现方框
                    .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
                    .replace(/\x1b/g, '');

                if (screen.innerHTML.startsWith('等待选择')) {
                    screen.innerHTML = '';
                }
                
                const logSpan = document.createElement('span');
                logSpan.innerHTML = formattedLog;
                screen.appendChild(logSpan);
                
                // 限制最多保存的子节点数，防止长时间运行导致内存消耗过大或页面响应变慢
                while (screen.childNodes.length > 2000) {
                    screen.removeChild(screen.firstChild);
                }
                
                screen.scrollTop = screen.scrollHeight;
            };

            sseConnection.onerror = function() {
                setTimeout(setupSSE, 3000);
            };
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function startStatusPolling() {
            const dot = document.getElementById('global-status-dot');
            const text = document.getElementById('global-status-text');
            const stopBtn = document.getElementById('btn-stop');
            const runningNode = document.getElementById('current-running-node');
            const runButtons = document.querySelectorAll('.run-btn');

            setInterval(() => {
                fetch('/api/status?task_id=' + taskId)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'running') {
                            dot.className = 'status-dot running';
                            text.textContent = '执行中';
                            stopBtn.className = 'stop-btn visible';
                            runningNode.textContent = `正在运行: ${data.current_test}`;
                            // 禁用所有运行按钮
                            runButtons.forEach(btn => btn.disabled = true);
                        } else {
                            stopBtn.className = 'stop-btn';
                            runningNode.textContent = '';
                            runButtons.forEach(btn => btn.disabled = false);

                            if (data.status === 'finished') {
                                if (data.exit_code === 0) {
                                    dot.className = 'status-dot finished-success';
                                    text.textContent = '完成 (成功)';
                                } else {
                                    dot.className = 'status-dot finished-failed';
                                    text.textContent = '完成 (失败)';
                                }
                                // 自动加载 Allure 报告
                                const iframe = document.getElementById('report-iframe');
                                if (iframe && iframe.style.display === 'none') {
                                    iframe.src = '/allure/' + taskId + '/';
                                    iframe.style.display = 'block';
                                    document.getElementById('report-placeholder').style.display = 'none';
                                }
                            } else {
                                dot.className = 'status-dot';
                                text.textContent = '就绪';
                            }
                        }
                    });
            }, 1000);
        }
    </script>

    <div id="receipt-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center;">

                <button onclick="document.getElementById('receipt-modal').style.display='none'" style="background: var(--primary-color); border: none; color: #fff; padding: 6px 20px; border-radius: 4px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='var(--primary-hover)'" onmouseout="this.style.background='var(--primary-color)'">保存并关闭</button>
            </div>
        </div>
    </div>
