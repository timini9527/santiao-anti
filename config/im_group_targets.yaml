# ==============================================================================
# 🎯 三条 IM 群组拓扑治理与建群好友池配置 (config/im_group_targets.yaml)
# ==============================================================================
# 核心定位：
#   1. 遵循单一职责原则，将「建群造数与群拓扑治理」同「消息压测消费 (im_targets.yaml)」彻底解耦。
#   2. 消除 tools/im_group_client.py 中的硬编码好友列表与运行参数，实现纯配置驱动建群。
#   3. 运行时自动与设备当前登录账号的本地 SQLite friend 表实时校验对齐（自动剔除自身与官方号）。
# ==============================================================================

# 当前全局激活的建群好友池预设 (可选: a0110_selected_friends / prefix_rule_friends)
active_profile: "a0110_selected_friends"

# ------------------------------------------------------------------------------
# 默认建群与群治理任务参数 (直接运行 tools/im_group_client.py 时生效，CLI 传参可覆盖)
# ------------------------------------------------------------------------------
group_task:
  # 运行模式:
  #   batch_single   : 单设备批量创建递增群聊 (如 正式群001 ~ 正式群010)
  #   single         : 单设备仅创建单个指定群聊 (target_group_name)
  #   batch_cluster  : 5 台模拟器集群批量创建专属群
  #   batch_transfer : 批量转让匹配前缀的群聊群主给 transfer_owner_to
  #   batch_quit     : 批量退出匹配前缀的群聊
  #   batch_disband  : 批量解散匹配前缀的群聊
  #   single_transfer / single_quit / single_disband : 单群治理操作
  mode: "batch_single"
  device_id: "emulator-5562"         # 指定执行建群的设备 ID (留空则按 target_device_index 选择)
  target_device_index: 0             # 集群设备索引 (0 -> emulator-5562)
  group_prefix: "多会话群"              # 批量群名称前缀/后缀关键字
  batch_count: 201                    # 批量创建群数量
  start_index: 1                     # 批量起始序号 (设为 null 则自动检测本地最大序号顺延)
  end_index: 201                      # 批量治理截止序号
  digits_padding: 3                  # 序号补零位数 (3 -> 001; 1 -> 1)
  target_group_name: "正式群001"      # 单群操作时的目标群名称
  transfer_owner_to: "A0110"         # 转让群主时的接收方标识 (手机号/昵称/备注/open_id)
  invite_batch_size: 49              # 建群及追加邀请单批人数上限 (触发后端限流时自动折半重试)

# ------------------------------------------------------------------------------
# 建群目标好友池预设矩阵
# ------------------------------------------------------------------------------
