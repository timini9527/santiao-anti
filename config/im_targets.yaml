# ==============================================================================
# 🎯 三条 IM 多设备压测会话策略配置 (config/im_targets.yaml)
# ==============================================================================
# 核心定位：
#   1. 实现压测目标会话与执行代码彻底解耦（DDT 数据驱动架构）。
#   2. 支持「设备本地 SQLite 动态自发现 (Zero Config)」与「静态目标兜底」双模式。
#   3. 通过切换 active_profile 一键切换压测场景，告别手动注释代码。
# ==============================================================================

# 当前全局激活的压测场景预设 (可选: offline_groups / dedicated_groups / single_chat)
active_profile: "offline_groups"

# ------------------------------------------------------------------------------
# 压测场景配置矩阵
# ------------------------------------------------------------------------------
profiles:
  # 场景 1：1-50群 齐步集群压测 (默认推荐，支持 5 台设备严格分片，每台独占 10 个群)
  offline_groups:
    description: "1-50群 齐步集群压测 (5 台设备严格平均分片发送)"
    discovery_mode: "static"          # auto: 自动连接设备 SQLite 拉取当前真实有效的群聊；static: 读取下方 static_targets 兜底
    pattern_prefix: "群"              # 匹配群聊名称 (支持 "1群" ~ "50群", 前后缀匹配： 离线群)
    max_groups: 50                    # 限制拉取最大群数
    shard_by_device: true             # 开启 5 台设备分片发送 (每台设备仅向专属 10 个群发送，消除 seq 冲突)
    include_dedicated_group: false    # 压测公共群时，不向各设备专属测试群(测试群001~005)发送

  # 场景 2：设备专属群一对一独立压测
  dedicated_groups:
    description: "5 台设备各自独占绑定的测试群 (测试群001 ~ 测试群005)"
    discovery_mode: "auto"
    pattern_prefix: "测试群"
    max_groups: 5
    shard_by_device: false
    include_dedicated_group: true

  # 场景 3：好友单聊并发压测
  single_chat:
    description: "好友单聊并发压测 (支持千人真实好友 Zero Config 动态自发现)"
    discovery_mode: "auto"          # auto: 自动连接设备 SQLite 抓取近 1000 个真实好友; static: 读取下方静态列表
    max_friends: 1000               # 限制拉取最大好友数
    shard_by_device: false
    include_dedicated_group: false

# ------------------------------------------------------------------------------
# 5 台设备默认专属绑定群映射 (供 dedicated_groups 场景与单机模式使用)
# ------------------------------------------------------------------------------
