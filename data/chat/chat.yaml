  # ----------------------------------------
  # 2. 图片消息 (Image Message)
  # ----------------------------------------
  image_message:
    - case_id: "MSG_IMG_001"
      title: "从相册发送 JPG 图片 (原图)"
      priority: "P0"
      tags: ["media", "smoke"]
      context:
        chat_type: "private"
      data:
        msg_type: "image"
        source: "gallery"
        file_name: "test_img_1080p.jpg"
        is_original: true # 勾选原图
      expected:
        ui_state: "sent_success"
        preview_load: true

    - case_id: "MSG_IMG_002"
      title: "发送 GIF 动图"
      priority: "P2"
      context:
        chat_type: "group"
      data:
        msg_type: "image"
        source: "gallery"
        file_name: "funny_cat.gif"
      expected:
        ui_state: "sent_success"
        animation_play: true # 验证是否自动播放

  # ----------------------------------------
  # 3. 表情消息 (Emoji Message)
  # ----------------------------------------
  emoji_message:
    - case_id: "MSG_EMO_001"
      title: "发送 1个 Emoji"
      priority: "P0"
      tags: ["media", "smoke"]
      context:
        chat_type: "private"
      data:
        msg_type: "emoji"
        payload: "😃"
      expected:
        ui_state: "sent_success"
        expected_payload: "😃"

  # ----------------------------------------
  # 3. 语音消息 (Voice Message)
  # ----------------------------------------
  voices_message:
    - case_id: "MSG_VOC_001"
      title: "发送正常语音 (10s)"
      priority: "P0"
      context:
        chat_type: "private"
      data:
        msg_type: "voice"
        action: "hold_to_talk"
        duration: 10
      expected:
        ui_state: "sent_success"
        voice_length_display: "10\""

    - case_id: "MSG_VOC_002"
      title: "语音录制时间过短 (<1s)"
      priority: "P2"
      context:
        chat_type: "private"
      data:
        msg_type: "voice"
        action: "hold_to_talk"
        duration: 0.5
      expected:
        ui_state: "cancelled" # 不发送
        toast: "说话时间太短"

  # ----------------------------------------
  # 4. 视频消息 (Video Message)
  # ----------------------------------------
  video_message:
    - case_id: "MSG_VID_001"
      title: "发送本地视频文件"
      priority: "P1"
      context:
        chat_type: "group"
      data:
        msg_type: "video"
        file_name: "demo_video_15s.mp4"
        file_size: "5MB"
      expected:
        ui_state: "sent_success"
        thumbnail_visible: true

  # ----------------------------------------
  # 5. 文件消息 (File Message)
  # ----------------------------------------
  file_message:
    - case_id: "MSG_FILE_001"
      title: "发送 PDF 文档"
      priority: "P1"
      context:
        chat_type: "private"
      data:
        msg_type: "file"
        file_name: "requirements_v1.0.pdf"
        file_extension: "pdf"
      expected:
        ui_state: "sent_success"
        icon_type: "pdf_icon"

  # ----------------------------------------
  # 6. 群聊特有功能 (Group Specific)
  # ----------------------------------------
  group_specific:
    - case_id: "MSG_GRP_001"
      title: "群聊 @单个成员"
      priority: "P0"
      context:
        chat_type: "group"
        target_group: "group_QA"
      data:
        msg_type: "text"
        payload: "@User_B 请确认 bug"
        mention_list: ["User_B_ID"]
      expected:
        ui_state: "sent_success"
        highlight_mention: true

    - case_id: "MSG_GRP_002"
      title: "群聊 @所有人 (管理员权限)"
      priority: "P1"
      context:
        chat_type: "group"
        user_role: "admin"
      data:
        msg_type: "text"
        payload: "@All 本周发布计划"
        mention_type: "all"
      expected:
        ui_state: "sent_success"

  # ----------------------------------------
  # 7. 交互式消息 (Interaction)
  # ----------------------------------------
  interaction:
    - case_id: "MSG_RPL_001"
      title: "引用/回复某条消息"
      priority: "P1"
      context:
        chat_type: "private"
      data:
        msg_type: "reply"
        target_msg_id: "prev_msg_001" # 引用的消息ID
        payload: "收到，明白。"
      expected:
        ui_state: "sent_success"
        quote_area_visible: true # 验证引用区域显示

    - case_id: "MSG_LOC_001"
      title: "发送地理位置"
      priority: "P2"
      context:
        chat_type: "private"
      data:
        msg_type: "location"
        coordinates: [39.90, 116.40]
        address: "Beijing, China"
      expected:
        ui_state: "sent_success"
        map_preview: true

  # ----------------------------------------
  # 8. 异常与网络场景 (Abnormal/Network)
  # ----------------------------------------
  network:
    - case_id: "MSG_ERR_001"
      title: "断网状态下发送消息"
      priority: "P1"
      tags: ["negative", "network"]
      context:
        chat_type: "private"
        network_condition: "offline"
      data:
        msg_type: "text"
        payload: "Offline msg"
      expected:
        ui_state: "sending_fail" # 红叹号或转圈超时
        allow_retry: true

    - case_id: "MSG_ERR_002"
      title: "发送空消息 (纯空格)"
      priority: "P2"
      tags: ["boundary"]
      context:
        chat_type: "private"
      data:
        msg_type: "text"
        payload: "   "
      expected:
        action_result: "send_button_disabled" # 按钮不可点，或发送无效



