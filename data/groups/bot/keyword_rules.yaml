test_suite_info:
  module: "Group_Bot_Keyword_Rules - 关键词合规与拦截规则"
  version: "2.0"
  author: "Auto"

test_data:
  # -------------------------------------------------------------
  # 1. 单个关键词合规录入（中文、字母、数字、混合，刚好10字边界）
  # 业务规则：单个关键词最多10个字，仅支持中文、字母和数字
  # -------------------------------------------------------------
  valid_single_keywords:
    - case_id: "KEYWORD_VALID_001"
      title: "纯中文合规"
      priority: "P0"
      data:
        keyword: "红包"
      expected:
        expected_word: "红包"

    - case_id: "KEYWORD_VALID_002"
      title: "纯英文合规"
      priority: "P0"
      data:
        keyword: "hello"
      expected:
        expected_word: "hello"

    - case_id: "KEYWORD_VALID_003"
      title: "纯数字合规"
      priority: "P0"
      data:
        keyword: "123456"
      expected:
        expected_word: "123456"

    - case_id: "KEYWORD_VALID_004"
      title: "中英数混合合规"
      priority: "P0"
      data:
        keyword: "中英mix123"
      expected:
        expected_word: "中英mix123"

    - case_id: "KEYWORD_VALID_005"
      title: "刚好10个中文字符边界"
      priority: "P0"
      data:
        keyword: "一二三四五六七八九十"
      expected:
        expected_word: "一二三四五六七八九十"

  # -------------------------------------------------------------
  # 2. 空格批量添加分词（核心新 UI 特性）
  # 业务规则：批量添加请用空格分隔，如：红包 广告 刷单
  # -------------------------------------------------------------
  batch_by_space_keywords:
    - case_id: "KEYWORD_BATCH_001"
      title: "标准空格分隔批量添加"
      priority: "P0"
      data:
        input_text: "红包 广告 刷单"
      expected:
        expected_words: ["红包", "广告", "刷单"]

    - case_id: "KEYWORD_BATCH_002"
      title: "含多重空格及前后空格分词"
      priority: "P1"
      data:
        input_text: "  特价    折扣  "
      expected:
        expected_words: ["特价", "折扣"]

  # -------------------------------------------------------------
  # 3. 超过10字截断与长度超限规则
  # 业务规则：单个关键词最多10个字
  # -------------------------------------------------------------
  length_truncate_keywords:
    - case_id: "KEYWORD_TRUNCATE_001"
      title: "超过10字超长违规词截断"
      priority: "P1"
      data:
        keyword: "超过十个字的超长违规词"
      expected:
        truncated_text: "单个关键词最多10个字"

  # -------------------------------------------------------------
  # 4. 非法字符与格式拦截规则
  # 业务规则：仅支持中文、字母和数字
  # -------------------------------------------------------------
  invalid_characters_keywords:
    - case_id: "KEYWORD_INVALID_001"
      title: "包含特殊符号拦截"
      priority: "P1"
      data:
        keyword: "abc#$"

    - case_id: "KEYWORD_INVALID_002"
      title: "纯特殊符号拦截"
      priority: "P1"
      data:
        keyword: "!@#"

    - case_id: "KEYWORD_INVALID_003"
      title: "邮箱格式拦截"
      priority: "P1"
      data:
        keyword: "test@abc.com"
