# 登录模块测试用例数据
# 设计原则：数据驱动测试 (DDT)
# 覆盖维度：成功路径 / 协议约束 / 账号异常 / 密码异常 / 格式边界 / 安全防护 / 交互状态
# 执行顺序建议：按 group_id 顺序执行

login_cases:

  # ==========================================
  # G1. 成功登录场景
  # ==========================================
  - id: G1_TC01
    desc: "合法账号密码 + 已勾选协议 → 登录成功"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: true
    eye_click: false
    expected_status: "success"
    expected_toast: ""
    priority: P0

  - id: G1_TC02
    desc: "点击密码眼睛图标切换明文后 → 登录成功（验证明文模式不影响登录）"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: true
    eye_click: true
    expected_status: "success"
    expected_toast: ""
    priority: P1

  # 密码含特殊字符的合法账号 → 登录成功（验证特殊字符不丢失）(没有账号，待完善)
  # - id: G1_TC03
  #   desc: "密码含特殊字符的合法账号 → 登录成功（验证特殊字符不丢失）"
  #   account: "38100000226"
  #   password: "Abc@1234!#"
  #   check_agreement: true
  #   eye_click: false
  #   expected_status: "success"
  #   expected_toast: ""
  #   priority: P1

  # ==========================================
  # G2. 协议约束场景
  # ==========================================
  - id: G2_TC01
    desc: "未勾选用户协议 → 弹出隐私协议提示框"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: false
    popup_action: "" # 不处理，仅验证弹窗弹出
    expected_status: "fail"
    expected_toast: "用户协议及隐私政策"
    priority: P0

  - id: G2_TC02
    desc: "未勾选协议弹窗后点击「同意」→ 完成登录"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: false
    popup_action: "agree"
    expected_status: "success"
    expected_toast: "用户协议及隐私政策"
    priority: P0

  - id: G2_TC03
    desc: "未勾选协议弹窗后点击「拒绝」→ 停留登录页"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: false
    popup_action: "reject"
    expected_status: "fail" # 拒绝后业务结果是登录失败
    expected_toast: "用户协议及隐私政策"
    priority: P1

  # ==========================================
  # G3. 账号异常场景 (仅展示精简后的代表)
  # ==========================================
  - id: G3_TC01
    desc: "账号为空 → 前端拦截提示"
    account: ""
    password: "a1234567B9"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请输入手机号"
    priority: P0

  - id: G3_TC02
    desc: "账号不存在（未注册手机号）→ 后端拒绝"
    account: "13900000000"
    password: "a1234567B9"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P0
  
  - id: G3_TC03
    desc: "账号长度不足（如 10 位手机号）→ 前端或后端拦截"
    account: "1380000000" 
    password: "a1234567B9"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P1
  
  - id: G3_TC04
    desc: "账号长度超限（如 12 位手机号）→ 前端限制输入或后端拦截去掉最后一位"
    account: "381000002251" 
    password: "a1234567B9"
    check_agreement: true
    expected_status: "success"
    expected_toast: ""
    priority: P1

  - id: G3_TC05
    desc: "账号包含非数字字符（英文字母/中文）→ 无法输入或提示错误"
    account: "138AAAA0000"
    password: "a1234567B9"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P2

  # 账号格式异常, 有问题待修复
  # - id: G3_TC08
  #   desc: "账号含前后空格 → 自动 trim 后正常登录"
  #   account: " 38100000225 "
  #   password: "a1234567B9"
  #   check_agreement: true
  #   expected_status: "success" # 明确预期产品逻辑（假设要求trim）
  #   expected_toast: ""
  #   priority: P2

  # ==========================================
  # G4. 密码异常场景
  # ==========================================
  - id: G4_TC01
    desc: "密码为空 → 前端拦截提示"
    account: "38100000225"
    password: ""
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请输入登录密码"
    priority: P0

  - id: G4_TC02
    desc: "密码错误 → 后端拒绝提示"
    account: "38100000225"
    password: "wrong_password"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P0

  - id: G4_TC03
    desc: "密码大小写敏感度验证（输入错误的大小写）→ 拒绝登录"
    account: "38100000225"
    password: "A1234567b9" 
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P0

  # ==========================================
  # G6. 安全与注入场景
  # ==========================================
  - id: G6_TC01
    desc: "账号输入 SQL 注入字符串 → 正常拦截"
    account: "' OR '1'='1"
    password: "a1234567B9"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P1

  - id: G6_TC03
    desc: "账号输入 XSS 跨站脚本 → 正常拦截（防日志注入/前端反射）"
    account: "<script>alert(1)</script>"
    password: "a1234567B9"
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P2

  - id: G6_TC04
    desc: "密码输入超长字符串（依赖代码替换）→ 正常拦截"
    account: "38100000225"
    password: "[LONG_STRING_1000]"  # Python 脚本中识别并替换
    check_agreement: true
    expected_status: "fail"
    expected_toast: "请检查手机号或密码是否正确"
    priority: P2

  # ==========================================
  # G7. 交互状态与 UI 行为场景
  # (使用专门的 assert_ui_state 字段指导测试代码)
  # ==========================================
  - id: G7_TC01
    desc: "账号和密码均为空时登录按钮置灰/禁用"
    account: ""
    password: ""
    check_agreement: true
    assert_ui_state: "button_disabled" # 测试代码读到这个，就去校验按钮状态，不再点击
    expected_status: "fail"
    expected_toast: ""
    priority: P1

  - id: G7_TC02
    desc: "密码框默认为密文状态"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: true
    eye_click: false
    assert_ui_state: "password_masked"
    expected_status: "fail" # 不执行登录，只校验 UI
    expected_toast: ""
    priority: P1

  - id: G7_TC03
    desc: "点击眼睛图标双向切换明密文"
    account: "38100000225"
    password: "a1234567B9"
    check_agreement: true
    eye_click: true
    assert_ui_state: "password_toggle"
    expected_status: "fail"
    expected_toast: ""
    priority: P1

  # ==========================================
  # G8. 弱网与异常环境场景
  # ==========================================
