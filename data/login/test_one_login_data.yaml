# 一键登录模块测试用例数据
# 设计原则：数据驱动测试 (DDT)

one_click_cases:
  # ==========================================
  # O1. 一键登录异常场景验证
  # ==========================================
  - id: O1_TC01
    desc: "无卡状态或弱网时一键登录 → 提示弹窗并拦截"
    check_agreement: true
    network_env: "offline_or_no_sim"
    expected_status: "fail"
    expected_toast: "尝试更换网络环境"
    priority: P0

  - id: O1_TC02
    desc: "未勾选协议点击一键登录 → 弹出隐私提示框"
    check_agreement: false
    expected_status: "fail"
    expected_toast: "用户协议及隐私政策"
    priority: P1
