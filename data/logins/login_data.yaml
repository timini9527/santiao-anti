# 登录功能测试用例 - 符合2025测试用例标准化格式
# 优先级说明：
# - P0: 最高优先级 - 核心功能，必须正常工作，影响系统稳定性
# - P1: 高优先级 - 主要功能，直接影响用户体验
# - P2: 中优先级 - 次要功能，影响部分用户体验
# - P3: 低优先级 - 边界情况，特殊场景，兼容性测试
#
# 标签说明：
# - smoke: 冒烟测试，验证核心功能
# - regression: 回归测试，验证功能完整性
# - positive: 正向测试，验证功能正常
# - negative: 负向测试，验证异常处理
# - validation: 验证测试，验证输入格式
# - performance: 性能测试，验证响应时间
login_test_cases:
  # TC_001: 正常登录-有效账号密码 (P0)
  - id: "TC_001"
    account: "38100000116"
    password: "a1234567B"
    expected: "success"
    desc: "正常登录-有效账号密码"
    priority: "P0"
    tags: [ "smoke", "regression", "positive" ]
    preconditions: "APP已安装并启动"
    steps:
      - "输入有效账号: 38100000116"
      - "输入有效密码: a1234567B"
      - "点击登录按钮"
    expected_result: "登录成功，跳转到首页"


